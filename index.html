    body::before,

    .reveal{opacity:0;transform:translateY(34px) scale(.985);filter:blur(8px);transition:opacity .85s ease,transform .85s cubic-bezier(.19,1,.22,1),filter .85s ease}

    .reveal.visible:nth-child(2n){transition-delay:.06s}.reveal.visible:nth-child(3n){transition-delay:.12s}.reveal.visible:nth-child(4n){transition-delay:.18s}

    .stat strong{display:inline-block;animation:counterPop .75s cubic-bezier(.19,1,.22,1) both}
    .hero .stats .stat,.stats .stat{transition:transform .35s ease,box-shadow .35s ease,background .35s ease}
    .hero .stats .stat:hover,.stats .stat:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 22px 55px rgba(7,26,51,.14)}

    .nav.scrolled,.nav-wrap.scrolled .nav{box-shadow:0 18px 60px rgba(7,26,51,.12) !important}
    .nav::after{
      content:"";position:absolute;left:18px;right:18px;bottom:6px;height:2px;border-radius:999px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transform:scaleX(.55);transition:.35s ease;
    }
    .nav:hover::after,.nav-wrap.scrolled .nav::after{opacity:.7;transform:scaleX(1)}

    .scroll-progress{
      position:fixed;top:0;left:0;height:3px;width:0%;z-index:9999;border-radius:0 999px 999px 0;
      background:linear-gradient(90deg,var(--gold),var(--gold2),#fff1b0);box-shadow:0 0 24px rgba(216,173,90,.55);
      transition:width .12s linear;
    }

    .cv-download-link{position:relative}
    .cv-download-link::after{content:"";position:absolute;left:50%;bottom:7px;width:0;height:2px;background:currentColor;opacity:.55;transition:.25s ease;transform:translateX(-50%)}
    .cv-download-link:hover::after{width:38%}

    .lightbox.open img{animation:lightboxZoom .35s cubic-bezier(.19,1,.22,1) both}

    @keyframes ambientDrift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(42px,-28px,0) scale(1.08)}}
    @keyframes pulseGlow{from{transform:scale(1);opacity:.45}to{transform:scale(1.16);opacity:.82}}
    @keyframes buttonBounce{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(-2px)}}
    @keyframes counterPop{from{transform:translateY(10px) scale(.92);opacity:.35}to{transform:translateY(0) scale(1);opacity:1}}
    @keyframes lightboxZoom{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}

    @media (max-width:760px){
      .about-panel{padding:28px 22px !important;border-radius:26px !important}
      .about-panel h2{font-size:clamp(34px,11vw,56px) !important;line-height:1.02 !important;letter-spacing:-.05em !important;margin-top:16px}
      .about-panel p{font-size:16px !important;line-height:1.8 !important}
      .about-panel .btn-row{display:grid !important;grid-template-columns:1fr !important}.about-panel .btn{width:100%}
      .scroll-progress{height:2px}
    }

    @media (prefers-reduced-motion:reduce){
      body::before,body::after,.about-panel::after{animation:none !important}.reveal{opacity:1 !important;transform:none !important;filter:none !important}
    }
